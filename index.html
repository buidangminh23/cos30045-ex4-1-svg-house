<!DOCTYPE html>
<html lang="en">
<head>

  <title>Exercise 4.1 SVG House</title>
  <link rel="stylesheet" href="css/style.css">

<body>
  <header>
    <h1>Exercise 4.1: Draw SVGs</h1>
  </header>

  <main>
    <h2>My SVG house and garden</h2>
    <div class="house-container">
      <svg viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg">
        <rect x="0" y="0" width="500" height="300" fill="skyblue" />
        <rect x="0" y="300" width="500" height="200" fill="green" />
        <circle cx="420" cy="80" r="40" fill="yellow" />
        <ellipse cx="120" cy="70" rx="50" ry="20" fill="white" />
        <polygon points="140,200 250,110 360,200" fill="peru" />
        <rect x="150" y="200" width="200" height="150" fill="saddlebrown" />
        <rect x="225" y="270" width="50" height="80" fill="sienna" />
        <circle cx="265" cy="312" r="4" fill="black" />
        <rect x="170" y="225" width="45" height="40" fill="lightblue" />
        <rect x="285" y="225" width="45" height="40" fill="lightblue" />
        <path d="M 230 350 C 200 400, 280 430, 230 500" fill="none" stroke="orange" stroke-width="4" />
        <path d="M 270 350 C 320 400, 260 430, 290 500" fill="none" stroke="orange" stroke-width="4" />
        <polyline points="20,330 40,310 60,330 80,310 100,330" fill="none" stroke="white" stroke-width="3" />
        <line x1="400" y1="330" x2="480" y2="330" stroke="black" stroke-width="2" />
        <text x="30" y="40" font-size="20">My House</text>
      </svg>
    </div>
  </main>
